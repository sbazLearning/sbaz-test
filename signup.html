<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f0f2f5;
      --card-bg: #ffffff;
      --text-color: #1a1a1a;
      --muted-text: #444444;
      --border-color: #cccccc;
      --focus-color: #4a90e2;
      --button-bg: #4a90e2;
      --button-hover-bg: #3a7bc8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--page-bg);
      color: var(--text-color);
    }

    .signup-card {
      width: 100%;
      max-width: 360px;
      padding: 2rem;
      background: var(--card-bg);
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .signup-card h1 {
      margin: 0 0 1.5rem;
      font-size: 1.5rem;
      text-align: center;
    }

    .field {
      margin-bottom: 1.25rem;
    }

    .field label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      color: var(--muted-text);
    }

    .field input {
      width: 100%;
      padding: 0.7rem 0.8rem;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      transition: border-color 0.15s ease;
    }

    .field input:focus {
      outline: none;
      border-color: var(--focus-color);
    }

    button {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      color: #ffffff;
      background: var(--button-bg);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover {
      background: var(--button-hover-bg);
    }

    button:focus-visible {
      outline: 2px solid var(--focus-color);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="signup-card">
    <form action="/signup" method="post">
      <h1>Sign Up</h1>

      <div class="field">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Username"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          required
        >
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Email"
          autocomplete="email"
          autocapitalize="none"
          spellcheck="false"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Password"
          autocomplete="new-password"
          required
        >
      </div>

      <button type="submit">Sign Up</button>
    </form>
  </main>
</body>
</html>
