<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#f0f2f5}form{background:#fff;padding:2rem;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:.75rem;width:280px}input{padding:.7rem;border:1px solid #ccc;border-radius:6px;font-size:1rem}input:focus{outline:none;border-color:#4a90e2}button{padding:.75rem;font-size:1rem;color:#fff;background:#4a90e2;border:0;border-radius:6px;cursor:pointer}button:hover{background:#3a7bc8}</style></head>
<body><form action="/login" method="post"><h1 style="margin:0 0 .5rem;font-size:1.4rem;text-align:center">Sign In</h1><input name="username" placeholder="Username" autocomplete="username" required><input type="password" name="password" placeholder="Password" autocomplete="current-password" required><button type="submit">Log In</button></form></body></html>
