<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent: #f97316;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #1e2432;
            --text-light: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 2px 10px rgba(30, 41, 59, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Verdana, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .signup-container {
            max-width: 400px;
            margin: 0 auto;
            background: var(--card);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary);
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius);
            background: var(--primary);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-light);
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        /* Remove native up/down spinner arrows on number fields */
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h2>Sign Up</h2>

        <!-- Form for creating a new user account. All fields are required except address. -->
        <form>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Your full name" required>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" placeholder="10-digit mobile number" required>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Create a password" required>
            </div>

            <button type="submit" class="btn">Create Account</button>

            <div class="login-link">
                Already have an account? <a href="login.html">Log In</a>
            </div>
        </div>
    </div>

    <!-- Toast notification container for success/error messages -->
    <div class="toast" id="toast"></div>

    <script>
        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (type ? ' ' + type : '');
            setTimeout(() => { t.className = 'toast'; }, 2800);
        }

        // Block browser spinner arrows on number fields so the value
        // doesn't silently nudge when scrolling or pressing arrow keys.
        // This applies globally so any number input in any app page
        // behaves predictably.
        document.addEventListener('wheel', function(e) {
            if (e.target.tagName === 'INPUT' && e.target.type === 'number' && document.activeElement === e.target) {
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('keydown', function(e) {
            if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') &&
                e.target.tagName === 'INPUT' && e.target.type === 'number') {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
